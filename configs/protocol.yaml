# Fixed training protocol (P20) shared by EVERY run in this project. Do not edit per-experiment;
# put justified deviations in the experiment yaml under `overrides` and document them in BASELINE_PROTOCOL.md.
#
# Budget: 20 epochs at 640 px on an RTX 4050 Laptop (6 GB). This is a REDUCED budget chosen so that the ~20 runs
# of this study fit the available compute; absolute numbers are therefore lower than fully converged literature
# numbers, but every model gets the identical budget, data, split and evaluation code.
common:
  epochs: 20
  imgsz: 640
  batch: 16            # gradients accumulate to nbs=64 -> effective batch 64 for every model
  nbs: 64
  workers: 8
  device: 0
  amp: true
  deterministic: true
  cache: false
  patience: 100        # no early stopping; best.pt chosen on VAL fitness (0.1*mAP50 + 0.9*mAP50-95)
  val: true
  plots: true
  # augmentation policy (Ultralytics defaults made explicit)
  mosaic: 1.0
  close_mosaic: 5
  mixup: 0.0
  copy_paste: 0.0
  fliplr: 0.5
  flipud: 0.0
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  erasing: 0.4
  # validation-time settings used during training
  conf: 0.001
  iou: 0.7
  max_det: 300
yolo:
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: false
rtdetr:
  # RT-DETR uses its own recommended optimizer (AdamW, lr 1e-4); documented deviation.
  optimizer: AdamW
  lr0: 0.0001
  lrf: 0.01
  weight_decay: 0.0001
  warmup_epochs: 3.0
  cos_lr: false
  batch: 8             # 6 GB memory limit; nbs=64 keeps the effective batch identical
  warmup_bias_lr: 0.0  # Ultralytics default 0.1 is an SGD value; with AdamW lr0=1e-4 it ran bias lr 300-700x too high
                       # during warm-up (B03 first attempt: mAP50 0.0006 / 0.0015 / 0.009 after epochs 1-3). Fixed 2026-10-08.
