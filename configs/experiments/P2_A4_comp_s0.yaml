name: P2_A4_comp_s0
description: "PILOT EXP-2: our model (A4) + domain-class repeat-factor sampling"
model: custom:A4
data: configs/data/rdd_v1_comp.yaml
seed: 0
init: checkpoints/pretrained/yolov8s.pt
overrides:
  batch: 8            # A0/A4 variants: P2 level does not fit 6 GB at batch 16; nbs 64 keeps effective batch 64
  epochs: 16          # 33,595 sampled entries x 16 = same optimisation steps as 26,868 x 20
  close_mosaic: 4
