experiment:
  name: P6_yolo26s_p2_s0
  description: 'Our multi-resolution idea on the strongest baseline: YOLO26s + P2
    (stride-4) detection level, every yolo26s.pt tensor with a counterpart transferred
    (P2 index remap, training/train.load_p2_shifted); real data, same budget as B04_yolo26s_s0,
    which is its fair comparison'
  model: yolo26s-p2.yaml
  init: checkpoints/pretrained/yolo26s.pt
  data: configs/data/rdd_v1.yaml
  seed: 0
  overrides:
    batch: 8
train_args:
  epochs: 20
  imgsz: 640
  batch: 8
  nbs: 64
  workers: 8
  device: 0
  amp: true
  deterministic: true
  cache: false
  patience: 100
  val: true
  plots: true
  mosaic: 1.0
  close_mosaic: 5
  mixup: 0.0
  copy_paste: 0.0
  fliplr: 0.5
  flipud: 0.0
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  erasing: 0.4
  conf: 0.001
  iou: 0.7
  max_det: 300
  optimizer: SGD
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: false
  data: /home/divon/BTP/configs/data/rdd_v1.yaml
  seed: 0
  project: /home/divon/BTP/experiments
  name: P6_yolo26s_p2_s0
  exist_ok: true
